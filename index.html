<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bookshelf">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0c0c0d">
<title>Bookshelf</title>
<script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.23.0/umd/index.min.js" integrity="sha384-0ASr5PEWAMtTnWsn0PzKmioHVDA4+QqFiJr94io/0DCrGP6E1gRAmbO6O8y5WZW9" crossorigin="anonymous"></script>
<style>
  /* Photos Library: her covers edge to edge inside the iPhone's own grammar.
     Shape rule: covers square in the grid, 4px in rows; fields 10px; groups 12px; sheets 22px; buttons and bars full capsule. */
  :root {
    color-scheme: light dark;
    --bg: #ffffff; --sheet: #f2f2f7; --group: #ffffff;
    --label: #111113; --label2: #636366; --sep: rgba(60, 60, 67, .2);
    --fill: rgba(118, 118, 128, .12); --fill-strong: rgba(118, 118, 128, .2);
    --tint: #177a63; --on-tint: #ffffff; --danger: #d70015; --seg-on: #ffffff;
    --glass: rgba(255, 255, 255, .72); --rim: rgba(0, 0, 0, .08); --lift: rgba(20, 30, 25, .16);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0c0c0d; --sheet: #1c1c1e; --group: #2c2c2e;
      --label: #f5f5f7; --label2: #a1a1a6; --sep: rgba(84, 84, 88, .6);
      --fill: rgba(118, 118, 128, .24); --fill-strong: rgba(118, 118, 128, .36);
      --tint: #40cf9f; --on-tint: #052a1f; --danger: #ff6961; --seg-on: #636366;
      --glass: rgba(30, 30, 32, .7); --rim: rgba(255, 255, 255, .1); --lift: rgba(0, 0, 0, .5);
    }
  }
  * { box-sizing: border-box; }
  html { background: var(--bg); }
  body { margin: 0; min-height: 100dvh; font-size: 17px; line-height: 1.3; color: var(--label); background: var(--bg);
    padding-bottom: calc(92px + env(safe-area-inset-bottom)); -webkit-tap-highlight-color: transparent; }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; background: none; border: 0; padding: 0; touch-action: manipulation; }
  ::selection { background: color-mix(in srgb, var(--tint) 30%, transparent); }
  input { caret-color: var(--tint); }
  :focus-visible { outline: 2px solid var(--tint); outline-offset: 2px; }
  [hidden] { display: none !important; }
  .ic { width: 22px; height: 22px; flex: none; fill: currentColor; }
  .visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

  /* Frosted glass is a web approximation of iOS materials, not Apple's Liquid Glass. */
  .glass { background: var(--glass); -webkit-backdrop-filter: blur(24px) saturate(180%); backdrop-filter: blur(24px) saturate(180%); }
  @media (prefers-reduced-transparency: reduce) { .glass { background: var(--group); -webkit-backdrop-filter: none; backdrop-filter: none; } }

  /* Navigation bar: empty until the large title scrolls away, then the small title and a hairline appear. */
  .topbar { position: fixed; z-index: 3; inset: 0 0 auto; height: calc(44px + env(safe-area-inset-top)); padding: env(safe-area-inset-top) 8px 0 16px;
    display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; box-shadow: 0 .5px 0 transparent; transition: box-shadow .2s, background-color .2s; }
  body:not(.scrolled) .topbar { background: transparent; -webkit-backdrop-filter: none; backdrop-filter: none; }
  .topbar #miniTitle { grid-column: 2; font-weight: 600; opacity: 0; transition: opacity .2s; }
  body.scrolled .topbar { box-shadow: 0 .5px 0 var(--sep); }
  body.scrolled .topbar #miniTitle { opacity: 1; }
  .navbtn { grid-column: 3; justify-self: end; display: grid; place-items: center; width: 44px; height: 44px; border-radius: 50%; color: var(--tint); }
  .navbtn .ic { width: 26px; height: 26px; padding: 3px; border-radius: 50%; background: var(--fill); }
  .navbtn:active { opacity: .5; }

  .head { padding: calc(44px + env(safe-area-inset-top)) 16px 10px; }
  .head h1 { margin: 0; font-size: 34px; font-weight: 700; line-height: 41px; letter-spacing: .01em; }
  .count { margin: 0 0 12px; font-size: 15px; color: var(--label2); font-variant-numeric: tabular-nums; }
  .search { display: flex; align-items: center; gap: 6px; height: 38px; padding: 0 8px; border-radius: 10px; background: var(--fill); color: var(--label2); }
  .search .ic { width: 18px; height: 18px; }
  .search input { flex: 1; min-width: 0; height: 100%; border: 0; outline: 0; background: none; color: var(--label); font-size: 17px; -webkit-appearance: none; }
  .search input::placeholder { color: var(--label2); }
  .search:focus-within { box-shadow: 0 0 0 2px color-mix(in srgb, var(--tint) 55%, transparent); }
  .search input::-webkit-search-cancel-button { filter: grayscale(1); }

  /* The library: one gapless grid of covers, nothing between her and the art. */
  .grid { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; }
  @media (min-width: 600px) { .grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); } }
  .tile { position: relative; display: block; width: 100%; aspect-ratio: 2 / 3; overflow: hidden; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  .tile img { pointer-events: none; -webkit-user-drag: none; }
  .tile .cover { position: absolute; inset: 0; transition: transform .15s ease-out, filter .15s; }
  .tile:active .cover { transform: scale(.96); filter: brightness(.9); }
  #list > li { transition: transform .18s cubic-bezier(.2, .9, .25, 1); }
  #list > li.lifted { position: relative; z-index: 2; transition: none; }
  #list > li.lifted .cover { transform: scale(1.08); box-shadow: 0 16px 34px var(--lift); }
  #list > li.lifted .ribbon, #list > li.lifted .badge { opacity: 0; }

  .cover { position: relative; display: block; overflow: hidden; background: var(--fill); }
  .cover img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity .2s; }
  .cover img.in { opacity: 1; }
  /* No cover image: a plain typographic cover in a colour picked from the title, title at the top, author at the foot. */
  .art { position: absolute; inset: 0; display: flex; flex-direction: column; gap: 6px; padding: 12px; color: #fff; text-align: left; background: var(--cloth); }
  .art b { display: -webkit-box; overflow: hidden; font-size: 15px; font-weight: 700; line-height: 1.15; -webkit-line-clamp: 5; -webkit-box-orient: vertical; overflow-wrap: break-word; -webkit-hyphens: auto; hyphens: auto; }
  .art small { display: -webkit-box; margin-top: auto; overflow: hidden; font-size: 11px; line-height: 1.2; opacity: .86; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }

  /* State is a mark on the cover: a ribbon with her queue number, a small badge for finished or wished. */
  .ribbon { position: absolute; top: 0; right: 8px; width: 24px; height: 34px; padding-top: 5px; font-size: 12px; font-weight: 700; text-align: center;
    color: #fff; background: rgba(0, 0, 0, .55); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 78%, 0 100%); font-variant-numeric: tabular-nums; }
  .badge { position: absolute; left: 6px; bottom: 6px; display: flex; align-items: center; gap: 3px; height: 22px; padding: 0 7px; border-radius: 999px;
    font-size: 12px; font-weight: 600; color: #fff; background: rgba(0, 0, 0, .5); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); }
  .badge .ic { width: 12px; height: 12px; }
  .tile:has(.ribbon) .art { padding-top: 42px; }

  .empty { display: grid; justify-items: center; gap: 6px; padding: 56px 32px; text-align: center; }
  .empty .ic { width: 52px; height: 52px; margin-bottom: 8px; color: var(--label2); }
  .empty h2 { margin: 0; font-size: 22px; font-weight: 700; }
  .empty p { max-width: 30ch; margin: 0 0 12px; color: var(--label2); }
  .pill { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 20px; border-radius: 999px;
    font-weight: 600; color: var(--on-tint); background: var(--tint); }
  .pill:active { transform: scale(.97); opacity: .9; }

  /* Tab bar: a floating capsule over the grid, with Add set apart under the thumb. */
  .dock { position: fixed; z-index: 3; left: 12px; right: 12px; bottom: calc(env(safe-area-inset-bottom) + 6px); max-width: 560px; margin: 0 auto; display: flex; gap: 10px; }
  .tabs { flex: 1; display: flex; height: 64px; padding: 4px; border-radius: 999px; box-shadow: 0 10px 30px var(--lift), inset 0 0 0 .5px var(--rim); }
  .tabs button { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    border-radius: 999px; font-size: 11px; font-weight: 600; transition: background-color .2s, color .2s; }
  .tabs button .ic { width: 25px; height: 25px; }
  .tabs button[aria-selected=true] { color: var(--tint); background: var(--fill); }
  .tabs button:active { background: var(--fill-strong); }
  .addbtn { flex: none; display: grid; place-items: center; width: 64px; height: 64px; border-radius: 50%; color: var(--on-tint); background: var(--tint);
    box-shadow: 0 10px 26px var(--lift), inset 0 0 0 .5px var(--rim); transition: transform .15s ease-out; }
  .addbtn .ic { width: 28px; height: 28px; }
  .addbtn:active { transform: scale(.92); }

  .menu { inset: auto 12px auto auto; top: calc(env(safe-area-inset-top) + 48px); margin: 0; min-width: 230px; border: 0; border-radius: 14px;
    padding: 4px 0; color: var(--label); box-shadow: 0 16px 40px var(--lift), inset 0 0 0 .5px var(--rim); overflow: hidden; }
  .menu button, .menu label { display: flex; align-items: center; justify-content: space-between; gap: 16px; width: 100%; min-height: 46px; padding: 0 16px; cursor: pointer; }
  .menu > * + * { box-shadow: inset 0 .5px 0 var(--sep); }
  .menu :active { background: var(--fill); }
  .menu input { position: absolute; width: 0; opacity: 0; }

  /* Sheets rise from the bottom and drag down to dismiss. */
  .sheet { position: fixed; inset: auto 0 0 0; width: 100%; max-width: 600px; max-height: calc(100dvh - env(safe-area-inset-top) - 10px); margin: 0 auto;
    padding: 0 16px calc(16px + env(safe-area-inset-bottom)); border: 0; border-radius: 22px 22px 0 0; color: var(--label); background: var(--sheet);
    overflow: auto; overscroll-behavior: contain; transition: transform .26s cubic-bezier(.3, .8, .25, 1); }
  .sheet::backdrop { background: rgba(0, 0, 0, .35); }
  .sheet[open]:not([data-vt]) { animation: rise .28s cubic-bezier(.2, .9, .25, 1); }
  @keyframes rise { from { transform: translateY(100%); } }
  .sheet-head, .book-head { touch-action: none; }
  .grab { position: sticky; top: 0; z-index: 1; height: 22px; margin: 0 -16px; touch-action: none; cursor: grab; background: var(--sheet); }
  .grab::before { content: ''; position: absolute; top: 7px; left: 50%; width: 36px; height: 5px; margin-left: -18px; border-radius: 3px; background: var(--fill-strong); }
  .close { position: absolute; top: 14px; right: 14px; z-index: 2; display: grid; place-items: center; width: 32px; height: 32px; border-radius: 50%; color: var(--label2); background: var(--fill); }
  .close .ic { width: 15px; height: 15px; }

  .book-head { display: grid; grid-template-columns: 112px 1fr; gap: 16px; align-items: end; padding: 10px 40px 20px 0; }
  .book-head .cover { aspect-ratio: 2 / 3; border-radius: 4px; box-shadow: 0 10px 24px var(--lift); }
  .book-head .art b { font-size: 13px; }
  .book-head h2 { margin: 0; font-size: 22px; font-weight: 700; line-height: 1.2; overflow-wrap: anywhere; }
  .book-head .author { margin: 4px 0 0; color: var(--label2); }
  .book-head .meta { margin: 4px 0 0; font-size: 15px; color: var(--label2); font-variant-numeric: tabular-nums; }
  .book-head .meta:empty { display: none; }

  /* About This Book: Open Library's description, clamped with a fade until she asks for more. */
  .about { padding: 14px 16px 6px; }
  .about h3 { margin: 0 0 6px; font-size: 17px; font-weight: 600; }
  .about p { max-width: 65ch; margin: 0 0 10px; font-size: 15px; line-height: 1.45; }
  .about .clamp { max-height: calc(15px * 1.45 * 6); overflow: hidden; -webkit-mask-image: linear-gradient(#000 55%, transparent); mask-image: linear-gradient(#000 55%, transparent); }
  .about .muted { color: var(--label2); }
  .about .more, .about .link { display: inline-flex; align-items: center; min-height: 44px; margin-right: 20px; font-size: 15px; font-weight: 600; color: var(--tint); text-decoration: none; }
  .about .skel { padding-bottom: 10px; }
  .facts { margin: 0 0 16px; padding: 4px 16px; }
  .facts div { display: flex; gap: 16px; justify-content: space-between; padding: 10px 0; font-size: 15px; }
  .facts div + div { box-shadow: inset 0 .5px 0 var(--sep); }
  .facts dt { flex: none; color: var(--label2); }
  .facts dd { margin: 0; text-align: right; }
  .manual form { display: grid; gap: 12px; padding: 12px 0 4px; }
  .manual label { display: grid; gap: 6px; font-size: 15px; color: var(--label2); }
  .manual input { height: 40px; padding: 0 12px; font-size: 17px; color: var(--label); background: var(--fill); border: 0; border-radius: 10px; -webkit-appearance: none; }
  .manual input:focus-visible { outline: 2px solid var(--tint); }
  .manual .pill { justify-self: start; }
  .group { margin-bottom: 16px; border-radius: 12px; background: var(--group); overflow: hidden; }
  .rate { display: flex; justify-content: center; gap: 6px; padding: 8px 0; }
  .rate button { display: grid; place-items: center; width: 50px; height: 50px; color: var(--tint); }
  .rate .ic { width: 36px; height: 36px; }
  .rate button.pop .ic { animation: pop .18s cubic-bezier(.3, 1.6, .5, 1) backwards; animation-delay: calc(var(--i) * 20ms); }
  @keyframes pop { from { transform: scale(.55); } }
  .seg { display: flex; gap: 2px; margin-bottom: 16px; padding: 2px; border-radius: 10px; background: var(--fill); }
  .seg button { flex: 1; min-height: 34px; border-radius: 8px; font-size: 14px; font-weight: 500; transition: background-color .2s; }
  .seg button[aria-checked=true] { font-weight: 600; background: var(--seg-on); box-shadow: 0 2px 6px rgba(0, 0, 0, .12), inset 0 0 0 .5px var(--rim); }
  .remove { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; min-height: 50px; border-radius: 12px; color: var(--danger); background: var(--group); }
  .remove:active { background: var(--fill); }

  .tall[open] { display: flex; flex-direction: column; }
  .tall { height: calc(100dvh - env(safe-area-inset-top) - 10px); overflow: hidden; padding-bottom: 0; }
  .sheet-head { display: flex; align-items: center; justify-content: space-between; padding: 0 0 12px; }
  .sheet-head h2 { margin: 0; font-size: 22px; font-weight: 700; }
  .text-btn { min-height: 44px; padding: 0 4px; font-weight: 600; color: var(--tint); }
  .add-to { margin: 0 0 12px; }
  .add-to .seg { margin: 0; }
  #msg { margin: 12px 4px 4px; font-size: 15px; color: var(--label2); }
  .rows { flex: 1; overflow: auto; overscroll-behavior: contain; list-style: none; margin: 0 -16px; padding: 0 16px 8px; }
  .row { display: grid; grid-template-columns: 44px 1fr 44px; gap: 12px; align-items: center; padding: 8px 0; box-shadow: inset 0 -.5px 0 var(--sep); }
  .row .cover { width: 44px; aspect-ratio: 2 / 3; border-radius: 4px; }
  .row .art { padding: 3px; }
  .row .art b { display: none; }
  .row .art small { display: none; }
  .row .t { display: -webkit-box; overflow: hidden; font-weight: 600; line-height: 1.2; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .row .a { margin-top: 2px; overflow: hidden; font-size: 15px; color: var(--label2); white-space: nowrap; text-overflow: ellipsis; }
  .addone { display: grid; place-items: center; width: 44px; height: 44px; border-radius: 50%; color: var(--tint); }
  .addone .ic { width: 30px; height: 30px; padding: 6px; border-radius: 50%; background: var(--fill); }
  .addone:disabled { cursor: default; }
  .addone:disabled .ic { color: var(--on-tint); background: var(--tint); }
  .skel .cover, .skel i { background: var(--fill); animation: breathe 1.2s ease-in-out infinite alternate; }
  .skel i { display: block; height: 12px; margin: 6px 0; border-radius: 6px; }
  @keyframes breathe { to { opacity: .45; } }
  .scan { flex: none; margin: 0 -16px; padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); box-shadow: 0 -.5px 0 var(--sep); }
  .scan label { width: 100%; min-height: 54px; font-size: 17px; }
  .scan label[aria-busy=true] { opacity: .6; pointer-events: none; }
  .scan input { position: absolute; width: 0; opacity: 0; }

  /* Long-press menu: the pressed cover lifts over a blurred page with its quick actions beneath. */
  .ctx { width: 100%; height: 100%; max-width: none; max-height: none; margin: 0; padding: 0; border: 0; background: transparent; overflow: hidden; }
  .ctx::backdrop { background: rgba(0, 0, 0, .28); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); }
  .ctx-stack { position: absolute; display: flex; flex-direction: column; gap: 10px; }
  .ctx[open] .ctx-stack { animation: ctxin .22s cubic-bezier(.2, .9, .25, 1); }
  @keyframes ctxin { from { transform: scale(.94); opacity: 0; } }
  .ctx-preview { padding: 0; }
  .ctx-preview .cover { width: 100%; aspect-ratio: 2 / 3; border-radius: 8px; box-shadow: 0 18px 44px var(--lift); }
  .ctx-menu { width: 250px; border-radius: 14px; overflow: hidden; color: var(--label); box-shadow: 0 18px 44px var(--lift), inset 0 0 0 .5px var(--rim); }
  .ctx-menu button { display: grid; grid-template-columns: 18px 1fr 22px; align-items: center; gap: 10px; width: 100%; min-height: 46px; padding: 0 16px 0 12px; text-align: left; }
  .ctx-menu button + button { box-shadow: inset 0 .5px 0 var(--sep); }
  .ctx-menu button:active { background: var(--fill); }
  .ctx-menu .tick .ic { width: 16px; height: 16px; }
  .ctx-menu .gap { height: 8px; background: var(--fill); }
  .ctx-menu .danger { color: var(--danger); }

  ::view-transition-group(lift) { animation-duration: .3s; animation-timing-function: cubic-bezier(.2, .9, .25, 1); }
  ::view-transition-old(root), ::view-transition-new(root) { animation-duration: .22s; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    ::view-transition-group(*), ::view-transition-old(*), ::view-transition-new(*) { animation: none !important; }
  }
</style>
</head>

<header class="topbar">
  <span id="miniTitle" aria-hidden="true">Library</span>
  <button class="navbtn" popovertarget="menu" aria-label="Backup options"><svg class="ic"><use href="#dots"/></svg></button>
</header>

<main>
  <div class="head">
    <h1 id="title">Library</h1>
    <p id="count" class="count"></p>
    <label class="search"><svg class="ic" aria-hidden="true"><use href="#search"/></svg><span class="visually-hidden">Search my books</span>
      <input type="search" id="q" placeholder="Title or author" autocomplete="off"></label>
  </div>
  <ul id="list" class="grid"></ul>
  <div id="empty" class="empty" hidden>
    <svg class="ic" aria-hidden="true"><use id="emptyIcon" href="#books"/></svg>
    <h2 id="emptyTitle"></h2>
    <p id="emptyText"></p>
    <button id="emptyAdd" class="pill"><svg class="ic" aria-hidden="true"><use href="#plus"/></svg>Add a Book</button>
  </div>
</main>

<div id="menu" class="menu glass" popover>
  <button id="export">Save Backup<svg class="ic" aria-hidden="true"><use href="#export"/></svg></button>
  <label>Restore from Backup<svg class="ic" aria-hidden="true"><use href="#restore"/></svg><input id="import" type="file" accept="application/json,.json"></label>
</div>

<nav class="dock">
  <div id="tabs" class="tabs glass" role="tablist" aria-label="Lists">
    <button role="tab" data-tab="shelf" aria-selected="true"><svg class="ic" aria-hidden="true"><use href="#books-fill"/></svg>Library</button>
    <button role="tab" data-tab="next" aria-selected="false"><svg class="ic" aria-hidden="true"><use href="#next"/></svg>Up Next</button>
    <button role="tab" data-tab="wish" aria-selected="false"><svg class="ic" aria-hidden="true"><use href="#wish"/></svg>Wishlist</button>
    <button role="tab" data-tab="read" aria-selected="false"><svg class="ic" aria-hidden="true"><use href="#read"/></svg>Finished</button>
  </div>
  <button id="add" class="addbtn" aria-label="Add a book"><svg class="ic" aria-hidden="true"><use href="#plus"/></svg></button>
</nav>

<dialog id="sheet" class="sheet" aria-labelledby="sheetTitle">
  <div class="grab" aria-hidden="true"></div>
  <button class="close" data-done aria-label="Close"><svg class="ic" aria-hidden="true"><use href="#x"/></svg></button>
  <div id="sheetBody"></div>
</dialog>

<dialog id="ctx" class="ctx" aria-label="Book actions">
  <div id="ctxStack" class="ctx-stack">
    <button id="ctxPreview" class="ctx-preview" aria-label="Open book"></button>
    <div id="ctxMenu" class="ctx-menu glass" role="menu"></div>
  </div>
</dialog>

<dialog id="dlg" class="sheet tall" aria-labelledby="addTitle">
  <div class="grab" aria-hidden="true"></div>
  <div class="sheet-head">
    <h2 id="addTitle">Add Books</h2>
    <button id="close" class="text-btn">Done</button>
  </div>
  <div class="add-to"><div id="addTo" class="seg" role="radiogroup" aria-label="Add to"></div></div>
  <form id="find" class="search" role="search"><svg class="ic" aria-hidden="true"><use href="#search"/></svg>
    <input type="search" id="q2" placeholder="Title, author or ISBN" enterkeyhint="search" autocomplete="off" aria-label="Search Open Library"></form>
  <p id="msg" aria-live="polite">Search Open Library, or scan the barcode on the back cover.</p>
  <ul id="results" class="rows"></ul>
  <div class="scan">
    <label class="pill" id="scanBtn"><svg class="ic" aria-hidden="true"><use href="#barcode"/></svg><span>Scan Barcode</span>
      <input id="photo" type="file" accept="image/*" capture="environment"></label>
  </div>
</dialog>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => `&#${c.charCodeAt(0)};`);
const reduced = matchMedia('(prefers-reduced-motion: reduce)');
let books = JSON.parse(localStorage.books || '[]');
let tab = 'shelf';
let addTo = 'shelf';
let found = [];
let searched = false; // no manual-add form until she has actually searched for something
let current = null;

const TABS = {
  shelf: ['Library', 'books', 'Your library is empty', 'Tap + to scan a barcode or search for a book.'],
  next: ['Up Next', 'next', 'Nothing up next', 'Open any book and choose Up Next to line it up here.', 'Hold a cover to drag it into a new order.'],
  wish: ['Wishlist', 'wish', 'Your wishlist is empty', 'In Add Books, choose Wishlist before you add.'],
  read: ['Finished', 'read', 'No finished books yet', 'Open a book and choose Finished to rate it.'],
};
const PLACES = [['shelf', 'Library'], ['next', 'Up Next'], ['wish', 'Wishlist']];
const CLOTH = ['#2e4a7d', '#7a2e3b', '#8a5a1f', '#4b3f72', '#6b4e3d', '#8c3b5e', '#35495e', '#9a4a2f', '#3a3f47', '#5c2f55'];
const ic = id => `<svg class="ic" aria-hidden="true"><use href="#${id}"/></svg>`;
const plural = (n, word) => `${n || 'No'} ${word}${n === 1 ? '' : 's'}`;
const keyOf = b => `${b.title}|${b.author}`.toLowerCase();
// crypto.randomUUID only exists on https (and newer iOS); the fallback keeps Add working anywhere.
const newId = () => crypto.randomUUID?.() ?? Date.now().toString(36) + Math.random().toString(36).slice(2);

function save() { localStorage.books = JSON.stringify(books); render(); }

// Every cover carries a cloth binding underneath; the real image fades in over it when it loads.
function cover(b, attr = '') {
  const hash = [...String(b.title)].reduce((h, c) => (h * 31 + c.charCodeAt(0)) >>> 0, 7);
  const img = b.cover ? `<img src="${esc(b.cover)}" alt="" loading="lazy" onload="this.naturalWidth > 10 ? this.classList.add('in') : this.remove()" onerror="this.remove()">` : '';
  return `<span class="cover" ${attr}><span class="art" style="--cloth:${CLOTH[hash % CLOTH.length]}"><b>${esc(b.title)}</b><small>${esc(b.author)}</small></span>${img}</span>`;
}

function visible(books, tab, q) {
  q = q.trim().toLowerCase();
  if (q) return books.filter(b => `${b.title} ${b.author}`.toLowerCase().includes(q));
  return books.filter(b => tab === 'shelf' ? b.status !== 'wish' : b.status === tab);
}

function render() {
  const q = $('#q').value.trim();
  const shown = visible(books, tab, q);
  const queue = books.filter(b => b.status === 'next').map(b => b.id);
  const [name, icon, emptyTitle, emptyText, hint] = TABS[tab];
  $('#title').textContent = $('#miniTitle').textContent = name;
  const count = q ? `${plural(shown.length, 'match')} for “${q}”` : plural(shown.length, 'book');
  $('#count').textContent = !q && hint && shown.length > 1 ? `${count} · ${hint}` : count;
  $('#list').innerHTML = shown.map(b => {
    const n = queue.indexOf(b.id) + 1;
    const mark = b.status === 'next' ? `<span class="ribbon">${n}</span>`
      : b.status === 'read' ? `<span class="badge">${b.rating ? ic('star-fill') + b.rating : ic('check')}</span>`
      : b.status === 'wish' ? `<span class="badge">${ic('wish-fill')}</span>` : '';
    const state = { next: `, up next number ${n}`, read: `, finished${b.rating ? `, ${b.rating} stars` : ''}`, wish: ', on wishlist' }[b.status] || '';
    return `<li><button class="tile" data-id="${esc(b.id)}" aria-label="${esc(`${b.title} by ${b.author || 'unknown author'}${state}`)}">${cover(b)}${mark}</button></li>`;
  }).join('');
  $('#empty').hidden = shown.length > 0;
  $('#emptyIcon').setAttribute('href', q ? '#search' : `#${icon}`);
  $('#emptyTitle').textContent = q ? 'No matches' : emptyTitle;
  $('#emptyText').textContent = q ? 'Check the spelling, or add it with the + button.' : emptyText;
  $('#emptyAdd').hidden = !!q || tab === 'next' || tab === 'read';
}

// Tabs
$('#tabs').onclick = e => {
  const btn = e.target.closest('[data-tab]');
  if (!btn) return;
  tab = btn.dataset.tab;
  $('#q').value = '';
  for (const b of $('#tabs').children) {
    const on = b === btn;
    b.setAttribute('aria-selected', on);
    b.querySelector('use').setAttribute('href', `#${TABS[b.dataset.tab][1]}${on ? '-fill' : ''}`);
  }
  render();
  scrollTo(0, 0);
};
$('#q').oninput = render;

// Small title in the navigation bar once the large title scrolls under it.
new IntersectionObserver(([e]) => document.body.classList.toggle('scrolled', !e.isIntersecting),
  { rootMargin: `-${$('.topbar').offsetHeight}px 0px 0px 0px` }).observe($('#title'));
$('.topbar').classList.add('glass');

// Sheets: open with a rise, close by button, backdrop, Escape, or dragging the grabber down.
function closeSheet(d) {
  if (!d.open) return;
  if (reduced.matches) return d.close();
  d.style.transform = 'translateY(100%)';
  setTimeout(() => { d.close(); d.style.transform = ''; }, 260);
}
for (const d of [$('#sheet'), $('#dlg')]) {
  let y0 = null, dy = 0, dragged = false;
  d.addEventListener('pointerdown', e => {
    if (!e.target.closest('.grab, .sheet-head, .book-head')) return;
    y0 = e.clientY; dy = 0; dragged = false; d.style.transition = 'none';
  });
  d.addEventListener('pointermove', e => {
    if (y0 === null) return;
    dy = Math.max(0, e.clientY - y0);
    if (dy > 4 && !dragged) { dragged = true; d.setPointerCapture(e.pointerId); } // capture only a real drag, so taps still reach buttons
    if (dragged) d.style.transform = `translateY(${dy}px)`;
  });
  const end = () => {
    if (y0 === null) return;
    y0 = null; d.style.transition = '';
    if (dy > 110) closeSheet(d); else d.style.transform = '';
  };
  d.addEventListener('pointerup', end);
  d.addEventListener('pointercancel', end);
  d.addEventListener('click', e => {
    if (dragged) { dragged = false; return; } // the click that ends a drag is not a backdrop tap
    if (e.target === d) closeSheet(d);
  });
  d.addEventListener('close', () => { delete d.dataset.vt; d.style.transform = ''; if (d.id === 'dlg') render(); });
}

// One book: the tapped cover lifts out of the grid into the sheet.
let expanded = false;
function openBook(tile) {
  current = tile.dataset.id;
  expanded = false;
  const sheet = $('#sheet');
  const show = () => { tile.querySelector('.cover').style.viewTransitionName = ''; renderSheet(); sheet.showModal(); loadDetails(current); };
  if (!document.startViewTransition || reduced.matches) return show();
  tile.querySelector('.cover').style.viewTransitionName = 'lift';
  sheet.dataset.vt = '1';
  document.startViewTransition(show);
}

// Hold a cover to lift it. On Up Next that starts a drag to reorder the queue; releasing
// without moving opens the quick actions, the way the iPhone home screen behaves.
let press = null;
let ctxId = null;
let ctxAt = 0;
const reorderable = () => tab === 'next' && !$('#q').value.trim();

$('#list').addEventListener('pointerdown', e => {
  const tile = e.target.closest('.tile');
  if (!tile || e.button > 0) return;
  press = { tile, x: e.clientX, y: e.clientY, fired: false, moved: false, id: e.pointerId };
  press.timer = setTimeout(() => {
    press.fired = true;
    if (reorderable()) liftTile(tile, e.pointerId); else openCtx(tile);
  }, 450);
});
const cancelPress = () => { if (press && !press.fired) { clearTimeout(press.timer); press = null; } };
$('#list').addEventListener('pointermove', e => {
  if (!press) return;
  const far = Math.hypot(e.clientX - press.x, e.clientY - press.y) > 10;
  if (!press.fired) { if (far) cancelPress(); return; }
  if (!press.lifted) return;
  if (far) press.moved = true;
  dragTile(e);
});
$('#list').addEventListener('pointerup', e => {
  if (press?.lifted) {
    const { tile, moved } = press;
    dropTile();
    if (!moved) openCtx(tile); // held, then let go without moving: she wanted the menu
    return;
  }
  cancelPress();
});
$('#list').addEventListener('pointercancel', () => { if (press?.lifted) dropTile(); else cancelPress(); });
// While a cover is lifted the finger must move the cover, not scroll the page.
$('#list').addEventListener('touchmove', e => { if (press?.lifted) e.preventDefault(); }, { passive: false });

// Reordering: the lifted cover follows her finger and the others shuffle around it live.
function liftTile(tile, pointerId) {
  const li = tile.closest('li');
  press.lifted = true;
  press.li = li;
  press.rect = li.getBoundingClientRect();
  li.classList.add('lifted');
  try { $('#list').setPointerCapture(pointerId); } catch {}
}

function dragTile(e) {
  const { li, rect } = press;
  li.style.transform = `translate(${e.clientX - press.x}px, ${e.clientY - press.y}px)`;
  const over = document.elementsFromPoint(e.clientX, e.clientY)
    .map(el => el.closest?.('#list > li')).find(el => el && el !== li);
  if (!over) return;
  const items = [...$('#list').children];
  const after = items.indexOf(over) > items.indexOf(li);
  over[after ? 'after' : 'before'](li);
  // The element moved under her finger, so re-anchor the drag to where it sits now.
  const now = li.getBoundingClientRect();
  press.x += now.left - rect.left;
  press.y += now.top - rect.top;
  press.rect = now;
  li.style.transform = `translate(${e.clientX - press.x}px, ${e.clientY - press.y}px)`;
}

function dropTile() {
  const { li } = press;
  li.classList.remove('lifted');
  li.style.transform = '';
  press = null;
  // Commit the on-screen order back into the queue, leaving every other book untouched.
  const order = [...$('#list').children].map(el => el.querySelector('.tile')?.dataset.id);
  const queue = order.map(id => books.find(b => b.id === id)).filter(b => b && b.status === 'next');
  let i = 0;
  books = books.map(b => (b.status === 'next' ? queue[i++] || b : b));
  save();
}
$('#list').addEventListener('contextmenu', e => {
  const tile = e.target.closest('.tile');
  if (!tile) return;
  e.preventDefault();
  if (!$('#ctx').open) openCtx(tile);
});
$('#list').onclick = e => {
  const tile = e.target.closest('.tile');
  if (!tile) return;
  if (press?.fired) { press = null; return; } // the release that ended a long-press is not a tap
  openBook(tile);
};

function openCtx(tile) {
  const b = books.find(x => x.id === tile.dataset.id);
  if (!b) return;
  clearTimeout(press?.timer);
  ctxId = b.id;
  const r = tile.getBoundingClientRect();
  const w = Math.min(r.width * 1.12, 170), h = w * 1.5, menuH = 5 * 46 + 8, stackW = Math.max(250, w);
  const left = Math.min(Math.max(r.left + r.width / 2 - stackW / 2, 12), innerWidth - stackW - 12);
  const top = Math.max(12, Math.min(r.top - (h - r.height) / 2, innerHeight - h - 10 - menuH - 24));
  $('#ctxStack').style.cssText = `left:${left}px;top:${top}px;width:${stackW}px`;
  const preview = $('#ctxPreview');
  preview.style.cssText = `width:${w}px;margin-left:${Math.min(Math.max(r.left + r.width / 2 - w / 2 - left, 0), stackW - w)}px`;
  preview.innerHTML = cover(b);
  preview.setAttribute('aria-label', `Open ${b.title}`);
  $('#ctxMenu').style.marginLeft = r.left + r.width / 2 > innerWidth / 2 ? 'auto' : '0';
  $('#ctxMenu').innerHTML = [...PLACES, ['read', 'Finished']].map(([v, l]) =>
    `<button role="menuitemradio" aria-checked="${b.status === v}" data-place="${v}"><span class="tick">${b.status === v ? ic('check') : ''}</span><span>${l}</span>${ic(TABS[v][1])}</button>`).join('')
    + `<div class="gap" role="separator"></div><button role="menuitem" class="danger" data-remove><span class="tick"></span><span>Remove</span>${ic('trash')}</button>`;
  ctxAt = performance.now();
  $('#ctx').showModal();
}

$('#ctx').addEventListener('click', e => {
  if (performance.now() - ctxAt < 450) return; // lifting the finger that opened the menu must not pick an item
  const ctx = $('#ctx');
  const b = books.find(x => x.id === ctxId);
  const btn = e.target.closest('button');
  ctx.close();
  if (!b || !btn) return;
  if (btn.dataset.place) { b.status = btn.dataset.place; save(); }
  else if (btn.hasAttribute('data-remove')) {
    if (confirm(`Remove “${b.title}” from your books?`)) { books = books.filter(x => x !== b); save(); }
  } else if (btn === $('#ctxPreview')) {
    const tile = $(`.tile[data-id="${CSS.escape(b.id)}"]`);
    if (tile) openBook(tile);
  }
});

// Book details, fetched the first time a book is opened and kept with the book.
const loading = new Set();
const failed = new Set();
const cleanText = t => String(t).split(/\r?\n\s*-{3,}/)[0].replace(/\[([^\]]+)\]\([^)]*\)/g, '$1').replace(/<[^>]*>/g, '').replace(/\r/g, '').trim();

// Open Library subjects are a grab bag: shelf codes, library flags and sentence-long strings. Keep the ones that read like a genre.
const JUNK = /^(accessible book|protected daisy|in library|overdrive|large type|open library|internet archive|reading level|new york times|bestseller|award|nyt|award winning|translations into|readers)/i;
function tidyGenres(list) {
  const out = [];
  const key = s => s.toLowerCase().replace(/[^a-z]/g, ''); // "Sci-Fi" and "sci fi" are the same word to her
  for (const raw of list || []) {
    const s = String(raw).replace(/^(fiction|nonfiction)[,:/]\s*/i, '').split(/\s*[\/,]\s*/)[0].trim();
    if (!s || s.length > 28 || s.includes(':') || /\d{4}/.test(s) || JUNK.test(s)) continue;
    const label = s.replace(/\s+/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
    const k = key(label);
    // Skip anything that repeats a genre already kept, in either direction ("Sci Fi" next to "Hard Sci Fi").
    if (out.some(x => key(x).includes(k) || k.includes(key(x)))) continue;
    out.push(label);
    if (out.length === 3) break;
  }
  return out;
}

async function loadDetails(id) {
  const b = books.find(x => x.id === id);
  if (!b || b.details || loading.has(id)) return;
  loading.add(id);
  failed.delete(id);
  try {
    let { key, year, pages, genres = [], publisher = '', description = '' } = b;
    if (!/^\/works\/OL\d+W$/.test(key || '')) {
      const params = `title=${encodeURIComponent(b.title)}${b.author ? `&author=${encodeURIComponent(b.author.split(',')[0])}` : ''}`;
      const fields = 'key,first_publish_year,number_of_pages_median,subject';
      const hit = async u => (await getJSON(u).catch(() => ({ docs: [] }))).docs?.[0];
      // The title+author index misses some books, so fall back to a plain search of both words.
      const doc = await hit(`https://openlibrary.org/search.json?${params}&limit=1&fields=${fields}`)
        || await hit(`https://openlibrary.org/search.json?q=${encodeURIComponent(`${b.title} ${b.author || ''}`.trim())}&limit=1&fields=${fields}`) || {};
      key = doc.key;
      year = year || doc.first_publish_year;
      pages = pages || doc.number_of_pages_median;
      if (!genres.length) genres = tidyGenres(doc.subject);
      // No publisher here on purpose: the search index hands back an arbitrary edition, often a foreign one.
    }
    if (/^\/works\/OL\d+W$/.test(key || '')) {
      const work = await getJSON(`https://openlibrary.org${key}.json`).catch(() => ({}));
      const text = typeof work.description === 'string' ? work.description : work.description?.value || '';
      description = description || cleanText(text);
      if (!genres.length) genres = tidyGenres(work.subjects);
    }
    // Google Books fills the gaps Open Library leaves, including a cover when Open Library has none.
    let coverFromGoogle = '';
    if (!description || !genres.length || !publisher || !b.cover) {
      const gb = (await googleBooks(`${b.title} ${b.author || ''}`.trim(), 1))[0];
      if (gb && gb.title.toLowerCase().slice(0, 18) === b.title.toLowerCase().slice(0, 18)) {
        description = description || gb.description;
        if (!genres.length) genres = tidyGenres(gb.genres);
        publisher = publisher || gb.publisher;
        year = year || gb.year;
        pages = pages || gb.pages;
        coverFromGoogle = gb.cover;
      }
    }
    const fresh = books.find(x => x.id === id);
    if (fresh) {
      fresh.details = { key: key || '', year: +year || 0, pages: +pages || 0, genres, publisher, description };
      if (!fresh.cover && coverFromGoogle) fresh.cover = coverFromGoogle;
      localStorage.books = JSON.stringify(books);
    }
  } catch {
    failed.add(id);
  }
  loading.delete(id);
  if (current === id && $('#sheet').open) renderSheet();
}

function metaText(b) {
  const year = b.details?.year || b.year, pages = b.details?.pages || b.pages;
  return [year, pages && `${pages} pages`].filter(Boolean).join(' · ');
}

function factsHTML(b) {
  const d = b.details;
  if (!d) return '';
  const rows = [['Genre', (d.genres || []).join(', ')], ['Publisher', d.publisher]].filter(r => r[1]);
  return rows.length ? `<dl class="facts group">${rows.map(([k, v]) => `<div><dt>${k}</dt><dd>${esc(v)}</dd></div>`).join('')}</dl>` : '';
}

function aboutHTML(b) {
  const d = b.details;
  if (!d) return failed.has(b.id)
    ? `<h3>About This Book</h3><p class="muted">Couldn't load details from Open Library. Check your connection.</p><button class="more" data-retry>Try Again</button>`
    : `<h3>About This Book</h3><div class="skel" aria-label="Loading details"><i style="width:94%"></i><i style="width:88%"></i><i style="width:91%"></i><i style="width:55%"></i></div>`;
  const text = String(d.description || ''); // details can arrive from a restored backup, so don't trust the type
  const paras = text.split(/\n\s*\n/).map(p => p.trim()).filter(Boolean);
  const long = text.length > 320;
  const body = paras.length
    ? `<div class="${long && !expanded ? 'clamp' : ''}">${paras.map(p => `<p>${esc(p)}</p>`).join('')}</div>`
    : `<p class="muted">Open Library doesn't have a description for this book.</p>`;
  return `<h3>About This Book</h3>${body}${long && !expanded ? '<button class="more" data-more>More</button>' : ''}${/^\/works\/OL\d+W$/.test(d.key || '') ? `<a class="link" href="https://openlibrary.org${d.key}" target="_blank" rel="noopener">View on Open Library</a>` : ''}`;
}

function renderSheet(popFrom = 0) {
  const b = books.find(b => b.id === current);
  if (!b) return closeSheet($('#sheet'));
  // One control for the book's four states, so something is always selected; stars appear under Finished.
  $('#sheetBody').innerHTML = `
    <div class="book-head">${cover(b, 'style="view-transition-name:lift"')}
      <div><h2 id="sheetTitle">${esc(b.title)}</h2><p class="author">${esc(b.author)}</p><p class="meta" id="meta">${esc(metaText(b))}</p></div></div>
    <div class="seg" role="radiogroup" aria-label="List">${[...PLACES, ['read', 'Finished']].map(([v, l]) =>
      `<button role="radio" aria-checked="${b.status === v}" data-place="${v}">${l}</button>`).join('')}</div>
    ${b.status === 'read' ? `<div class="group rate" role="radiogroup" aria-label="Your rating">${[1, 2, 3, 4, 5].map(n =>
      `<button role="radio" aria-checked="${b.rating === n}" aria-label="${n} star${n > 1 ? 's' : ''}" data-rate="${n}" style="--i:${n}" class="${popFrom && n <= popFrom ? 'pop' : ''}">${ic(n <= b.rating ? 'star-fill' : 'star')}</button>`).join('')}</div>` : ''}
    ${factsHTML(b)}
    <div class="group about" id="about" aria-live="polite">${aboutHTML(b)}</div>
    <button class="remove" data-remove>${ic('trash')}Remove from Bookshelf</button>`;
}

$('#sheet').addEventListener('click', e => {
  const btn = e.target.closest('button');
  if (!btn) return;
  if (btn.hasAttribute('data-done')) return closeSheet($('#sheet'));
  const b = books.find(b => b.id === current);
  if (btn.hasAttribute('data-more')) { expanded = true; $('#about').innerHTML = aboutHTML(b); return; }
  if (btn.hasAttribute('data-retry')) { failed.delete(b.id); $('#about').innerHTML = aboutHTML(b); return loadDetails(b.id); }
  let pop = 0;
  if (btn.dataset.rate) pop = b.rating = +btn.dataset.rate;
  else if (btn.dataset.place) b.status = btn.dataset.place;
  else if (btn.hasAttribute('data-remove')) {
    if (!confirm(`Remove “${b.title}” from your books?`)) return;
    books = books.filter(x => x !== b);
    closeSheet($('#sheet'));
    return save();
  } else return;
  save();
  renderSheet(pop);
  $(`#sheetBody [data-${pop ? `rate="${pop}"` : `place="${b.status}"`}]`)?.focus();
});

// Adding books: Open Library search (free, no key) by text or ISBN.
function renderAddTo() {
  $('#addTo').innerHTML = PLACES.map(([v, l]) => `<button type="button" role="radio" aria-checked="${addTo === v}" data-to="${v}">${l}</button>`).join('');
}
function openAdd() {
  searched = false;
  found = [];
  $('#results').innerHTML = '';
  $('#q2').value = '';
  $('#msg').textContent = 'Search by title, author or ISBN, or scan the barcode on the back cover.';
  addTo = tab === 'next' || tab === 'wish' ? tab : 'shelf';
  renderAddTo();
  $('#dlg').showModal();
}
$('#add').onclick = $('#emptyAdd').onclick = openAdd;
$('#addTo').onclick = e => { const b = e.target.closest('[data-to]'); if (b) { addTo = b.dataset.to; renderAddTo(); drawResults(); } };
$('#close').onclick = () => closeSheet($('#dlg'));
// Results arrive as she types; Enter just skips the wait.
const ADD_HINT = 'Search by title, author or ISBN, or scan the barcode on the back cover.';
let typeTimer;
$('#q2').oninput = () => {
  clearTimeout(typeTimer);
  const q = $('#q2').value.trim();
  if (q.length < 3) {
    searchSeq++; // abandon whatever is in flight
    searched = false;
    found = [];
    $('#results').innerHTML = '';
    $('#msg').textContent = ADD_HINT;
    return;
  }
  typeTimer = setTimeout(() => lookup(q), /^[\d-]{10,17}x?$/i.test(q) ? 150 : 450);
};
$('#find').onsubmit = e => {
  e.preventDefault();
  clearTimeout(typeTimer);
  const q = $('#q2').value.trim();
  if (q) { $('#q2').blur(); lookup(q); }
};

// One retry after a pause: Open Library rate-limits bursts, and a phone's connection drops a request now and then.
async function getJSON(url, retry = 1) {
  const r = await fetch(url);
  if (r.ok) return r.json();
  if (retry && (r.status === 429 || r.status >= 500)) {
    await new Promise(done => setTimeout(done, 1200));
    return getJSON(url, 0);
  }
  throw new Error(r.status);
}

// Two book databases behind one shape. SOURCES sets who answers first; the other one
// covers what the first is missing. Swap the order to change which database leads.
// Books API key, restricted to this site and to the Books API: usable by anyone who views source,
// but only from statman15.github.io and only for book lookups.
const GOOGLE_KEY = 'AIzaSyCowSHQ6mw-YimmIKH7CvDmpithdbUoRI8';
// Open Library answers first: on a title search its top hit was the real book every time, where
// Google offered study guides and summaries. Google covers the editions Open Library never got.
const SOURCES = ['openlibrary', 'google'];
// Google's catalogue carries unofficial summaries and workbooks that outrank the real book.
const SPAM = /^(summary|analysis|study guide|workbook|conversation starters|a joosr guide|key takeaways|quicklet|sparknotes)\b/i;

async function googleBooks(q, max = 20) {
  try {
    const key = GOOGLE_KEY ? `&key=${GOOGLE_KEY}` : '';
    const d = await getJSON(`https://www.googleapis.com/books/v1/volumes?q=${encodeURIComponent(q)}&maxResults=${max}&printType=books${key}`);
    return (d.items || []).map(it => {
      const v = it.volumeInfo || {};
      return {
        title: [v.title, v.subtitle].filter(Boolean).join(': '),
        author: (v.authors || []).join(', '),
        cover: (v.imageLinks?.thumbnail || '').replace(/^http:/, 'https:').replace('&edge=curl', ''),
        year: +String(v.publishedDate || '').slice(0, 4) || 0,
        pages: v.pageCount || 0,
        genres: v.categories || [],
        publisher: v.publisher || '',
        description: cleanText(v.description || ''),
      };
    }).filter(b => b.title && !SPAM.test(b.title));
  } catch {
    return [];
  }
}

async function openLibrary(q, isbn) {
  try {
    if (isbn) {
      // The books API returns the exact edition (English title, that edition's cover); search returns the original work.
      const d = (await getJSON(`https://openlibrary.org/api/books?bibkeys=ISBN:${isbn}&jscmd=data&format=json`))[`ISBN:${isbn}`];
      return d ? [{ title: d.title, author: (d.authors || []).map(a => a.name).join(', '), cover: d.cover?.medium || '',
        year: +(d.publish_date || '').match(/\d{4}/)?.[0] || 0, pages: d.number_of_pages || 0,
        genres: tidyGenres((d.subjects || []).map(s => s.name || s)), publisher: (d.publishers || [])[0]?.name || '' }] : [];
    }
    return (await getJSON(`https://openlibrary.org/search.json?q=${encodeURIComponent(q)}&limit=20&fields=key,title,author_name,cover_i,first_publish_year,number_of_pages_median`)).docs.map(d => ({
      title: d.title,
      author: (d.author_name || []).join(', '),
      cover: d.cover_i ? `https://covers.openlibrary.org/b/id/${d.cover_i}-M.jpg` : '',
      key: d.key, year: d.first_publish_year || 0, pages: d.number_of_pages_median || 0,
    }));
  } catch {
    return [];
  }
}

const ask = (name, q, isbn) => name === 'google'
  ? googleBooks(isbn ? `isbn:${isbn}` : q, isbn ? 5 : 20)
  : openLibrary(q, isbn);

let searchSeq = 0;
async function lookup(q) {
  const seq = ++searchSeq; // a slower earlier search must never overwrite a newer one
  searched = true;
  $('#msg').textContent = 'Searching…';
  $('#results').innerHTML = '<li class="row skel"><span class="cover"></span><span><i style="width:70%"></i><i style="width:40%"></i></span></li>'.repeat(4);
  const isbn = /^[\d-]{10,17}x?$/i.test(q) && q.replace(/-/g, '');
  try {
    found = [];
    for (const name of SOURCES) {
      found = await ask(name, q, isbn);
      if (found.length) break; // the second source only answers what the first could not
    }
    if (seq !== searchSeq) return; // she typed on; a newer search owns the results
    $('#msg').textContent = found.length ? `Tap + to add to ${PLACES.find(p => p[0] === addTo)[1]}.`
      : isbn ? `No book found for ISBN ${isbn}. Search by the title, or add it yourself.` : 'No matches. Check the spelling, or add it yourself.';
    drawResults();
  } catch {
    if (seq !== searchSeq) return;
    $('#results').innerHTML = '';
    $('#msg').textContent = "Couldn't reach the book services. Check your connection, then search again.";
  }
}

// Nothing found anywhere: she can still put the book on her shelf by hand.
function manualForm(prefill = '') {
  const looksLikeIsbn = /^[\d-]{10,17}x?$/i.test(prefill);
  $('#results').innerHTML = `<li class="manual"><form id="byhand">
    <label>Title<input name="title" required value="${looksLikeIsbn ? '' : esc(prefill)}" autocomplete="off" enterkeyhint="done"></label>
    <label>Author<input name="author" autocomplete="off" enterkeyhint="done"></label>
    <button class="pill" type="submit">${ic('plus')}Add to ${esc(PLACES.find(p => p[0] === addTo)[1])}</button>
  </form></li>`;
  $('#byhand').onsubmit = e => {
    e.preventDefault();
    const f = new FormData(e.target);
    const title = String(f.get('title')).trim();
    if (!title) return;
    books.push({ title, author: String(f.get('author')).trim(), cover: '', id: newId(), status: addTo, rating: 0 });
    save();
    $('#results').innerHTML = '';
    $('#msg').textContent = `Added “${title}” to ${PLACES.find(p => p[0] === addTo)[1]}.`;
  };
  // No autofocus: this form can appear mid-keystroke, and stealing the caret would break her typing.
}

function drawResults() {
  if (!found.length) return searched ? manualForm($('#q2').value.trim()) : undefined;
  const have = new Set(books.map(keyOf));
  const where = PLACES.find(p => p[0] === addTo)[1];
  $('#results').innerHTML = found.map((b, i) => {
    const owned = have.has(keyOf(b));
    return `<li class="row">${cover(b)}<div><div class="t">${esc(b.title)}</div><div class="a">${esc(b.author)}</div></div>
      <button class="addone" data-i="${i}" ${owned ? 'disabled' : ''} aria-label="${owned ? `${esc(b.title)} is already in your books` : `Add ${esc(b.title)} to ${where}`}">${ic(owned ? 'check' : 'plus')}</button></li>`;
  }).join('');
}

$('#results').onclick = e => {
  const btn = e.target.closest('.addone');
  if (!btn || btn.disabled) return;
  const b = found[btn.dataset.i];
  books.push({ ...b, id: newId(), status: addTo, rating: 0 });
  save();
  btn.disabled = true;
  btn.innerHTML = ic('check');
  $('#msg').textContent = `Added “${b.title}” to ${PLACES.find(p => p[0] === addTo)[1]}.`;
};

// Photo of the back cover -> ISBN. Downscale first: a 12MP iPhone photo is slow to scan.
async function readBarcode(file) {
  const img = new Image();
  await new Promise((ok, fail) => { img.onload = ok; img.onerror = fail; img.src = URL.createObjectURL(file); });
  const scale = Math.min(1, 1600 / Math.max(img.naturalWidth, img.naturalHeight));
  const c = document.createElement('canvas');
  c.width = img.naturalWidth * scale;
  c.height = img.naturalHeight * scale;
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  URL.revokeObjectURL(img.src);
  const hints = new Map([[ZXing.DecodeHintType.POSSIBLE_FORMATS, [ZXing.BarcodeFormat.EAN_13]], [ZXing.DecodeHintType.TRY_HARDER, true]]);
  const bitmap = new ZXing.BinaryBitmap(new ZXing.HybridBinarizer(new ZXing.HTMLCanvasElementLuminanceSource(c)));
  return new ZXing.MultiFormatReader().decode(bitmap, hints).getText();
}

$('#photo').onchange = async e => {
  const file = e.target.files[0];
  e.target.value = '';
  if (!file) return;
  const btn = $('#scanBtn');
  btn.setAttribute('aria-busy', 'true');
  btn.querySelector('span').textContent = 'Reading Barcode…';
  $('#msg').textContent = 'Reading the barcode…';
  $('#results').innerHTML = '';
  try {
    const isbn = await readBarcode(file);
    $('#q2').value = isbn;
    await lookup(isbn);
  } catch {
    $('#msg').textContent = "Couldn't find a barcode in that photo. Fill the frame with the barcode and try again, or type the title.";
  } finally {
    btn.removeAttribute('aria-busy');
    btn.querySelector('span').textContent = 'Scan Barcode';
  }
};

// Books live only on this phone, so backups matter. Share sheet -> Save to Files.
$('#export').onclick = () => {
  $('#menu').hidePopover();
  const file = new File([JSON.stringify(books)], `bookshelf-${new Date().toISOString().slice(0, 10)}.json`, { type: 'application/json' });
  if (navigator.canShare?.({ files: [file] })) return navigator.share({ files: [file] }).catch(() => {});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(file);
  a.download = file.name;
  a.click();
};
$('#import').onchange = async e => {
  $('#menu').hidePopover();
  const file = e.target.files[0];
  e.target.value = '';
  if (!file) return;
  try {
    const data = JSON.parse(await file.text());
    if (!Array.isArray(data) || !data.every(b => b.id && b.title && ['shelf', 'next', 'wish', 'read'].includes(b.status))) throw 0;
    if (confirm(`Replace your ${books.length} books with the ${data.length} in this backup?`)) { books = data; save(); }
  } catch {
    alert("That file isn't a Bookshelf backup.");
  }
};

render();
</script>
